name: raspiflutter
description: Express schedule parser for Android and iOS.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Сеть и парсинг
  html: ^0.15.6
  http: ^1.2.2

  # Локальное хранилище
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4
  sqflite: ^2.4.1

  # Уведомления и виджет
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^20.1.0
  home_widget: ^0.9.0
  timezone: ^0.10.1

  # UI
  custom_refresh_indicator: ^4.0.1
  google_fonts: ^8.0.2
  intl: ^0.20.2
  table_calendar: ^3.1.3
  flutter_staggered_animations: ^1.1.1

  # Чат и медиа
  flyer_chat_file_message: ^2.3.1
  flyer_chat_image_message: ^2.3.0
  flyer_chat_text_message: ^2.6.0
  flutter_chat_core: ^2.9.0
  flutter_chat_ui: ^2.11.1
  flutter_markdown_plus: ^1.0.7
  photo_view: ^0.15.0
  file_picker: ^10.3.3
  image_picker: ^1.0.7
  just_audio: ^0.9.40
  record: ^6.0.0

  # Остальное
  equatable: ^2.0.5
  flutter_bloc: ^8.1.6
  package_info_plus: ^8.1.2
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.5.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#7EB5D8"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

name: raspiflutter
description: Express schedule parser for Android and iOS.
publish_to: "none"

# Версия — единственный источник истины для релиза (workflow читает её отсюда).
# Build-номер после «+» становится versionCode Android: major*10000 + minor*100 + patch.
version: 2.0.5+20005

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Сеть и парсинг
  html: ^0.15.6
  http: ^1.2.2

  # Локальное хранилище
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1

  # Уведомления и виджет
  firebase_core: ^4.10.0
  firebase_crashlytics: ^5.2.3
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^22.0.0
  home_widget: ^0.9.1
  timezone: ^0.11.0

  # UI
  google_fonts: ^8.0.2
  intl: ^0.20.2
  table_calendar: ^3.1.3
  flutter_staggered_animations: ^1.1.1
  animations: ^2.1.2

  # Markdown (ченджлог, release-ноты) и файлы
  flutter_markdown_plus: ^1.0.7
  file_picker: ^11.0.0

  # Обновления приложения
  connectivity_plus: ^6.1.0
  crypto: ^3.0.6

  # Остальное
  package_info_plus: ^8.3.1
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  webview_flutter: ^4.10.0
  firebase_analytics: ^12.4.2
  workmanager: ^0.9.0
  easy_refresh: ^3.5.0
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.5.4

flutter:
  uses-material-design: true
  fonts:
    - family: Ndot77JPExtended
      fonts:
        - asset: assets/fonts/Ndot77JPExtended.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Light.ttf
          weight: 300
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700

  assets:
    - assets/icon/app_icon.png
    - CHANGELOG.md

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  # Matches in-app icon: dark circle behind the logo.
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

# Native splash — pure black (#000000) like the reference device screen.
flutter_native_splash:
  color: "#000000"
  image: assets/icon/app_icon.png
  # Edge-to-edge black until Flutter draws the first frame.
  fullscreen: true
  android_12:
    color: "#000000"
    image: assets/icon/app_icon.png
  web: false

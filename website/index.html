<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">Расписание</div>
            <button class="icon-btn" id="settingsBtn" aria-label="Настройки">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M12 1v6m0 6v6M5.64 5.64l4.24 4.24m4.24 4.24l4.24 4.24M1 12h6m6 0h6M5.64 18.36l4.24-4.24m4.24-4.24l4.24-4.24"></path>
                </svg>
            </button>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="quick-actions" id="quickActions" style="display: none;">
                <button class="quick-btn" id="refreshBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                    Обновить
                </button>
                <button class="quick-btn" id="changeGroupBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    Сменить группу
                </button>
            </div>

            <div class="current-group" id="currentGroup" style="display: none;">
                <div class="group-badge">
                    <span id="currentGroupName"></span>
                </div>
            </div>

            <div class="schedule-section" id="scheduleSection" style="display: none;">
                <div class="schedule-list" id="scheduleContainer"></div>
            </div>

            <div class="loading-state" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Загрузка расписания...</p>
            </div>

            <div class="error-state" id="error" style="display: none;">
                <div class="error-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                </div>
                <p id="errorText"></p>
                <button class="btn btn-primary" onclick="app.loadSchedule()">Попробовать снова</button>
            </div>

            <div class="empty-state" id="emptyState">
                <div class="empty-icon">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                </div>
                <h2>Добро пожаловать!</h2>
                <p>Выберите группу в настройках, чтобы начать</p>
                <button class="btn btn-primary" id="openSettingsBtn">Выбрать группу</button>
            </div>
        </div>
    </main>

    <div class="modal" id="settingsModal">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Настройки</h2>
                <button class="modal-close" id="closeModal">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Колледж</label>
                    <select id="collegeSelect" class="form-input">
                        <option value="chtotib">ЧТОТИБ</option>
                        <option value="zabgc">ЗАБГК</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Группа</label>
                    <div class="group-select-wrapper">
                        <select id="groupSelect" class="form-input" disabled>
                            <option value="">Загрузка групп...</option>
                        </select>
                        <div class="group-loading" id="groupLoading" style="display: none;">
                            <div class="mini-spinner"></div>
                        </div>
                    </div>
                    <small class="form-hint">Или введите файл вручную</small>
                    <input type="text" id="groupInput" class="form-input" placeholder="cg36.htm" style="margin-top: 0.5rem;">
                </div>

                <div class="form-group">
                    <label>Настройки отображения</label>
                    <div class="settings-switches">
                        <label class="switch-label">
                            <input type="checkbox" id="showBreaks" checked>
                            <span>Показывать перемены</span>
                        </label>
                        <label class="switch-label">
                            <input type="checkbox" id="showLunch" checked>
                            <span>Показывать обеды</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Тема оформления</label>
                    <div class="theme-selector">
                        <button class="theme-btn" data-theme="dark" title="Тёмная">
                            <div class="theme-preview dark"></div>
                            <span>Тёмная</span>
                        </button>
                        <button class="theme-btn" data-theme="light" title="Светлая">
                            <div class="theme-preview light"></div>
                            <span>Светлая</span>
                        </button>
                        <button class="theme-btn" data-theme="purple" title="Фиолетовая">
                            <div class="theme-preview purple"></div>
                            <span>Фиолетовая</span>
                        </button>
                        <button class="theme-btn" data-theme="green" title="Зелёная">
                            <div class="theme-preview green"></div>
                            <span>Зелёная</span>
                        </button>
                        <button class="theme-btn" data-theme="newyear" title="Новогодняя">
                            <div class="theme-preview newyear"></div>
                            <span>Новогодняя</span>
                        </button>
                        <button class="theme-btn" data-theme="halloween" title="Хеллоуин">
                            <div class="theme-preview halloween"></div>
                            <span>Хеллоуин</span>
                        </button>
                        <button class="theme-btn" data-theme="nothing" title="Nothing">
                            <div class="theme-preview nothing"></div>
                            <span>Nothing</span>
                        </button>
                    </div>
                </div>

                <button class="btn btn-primary btn-full" id="loadBtn">
                    <span>Загрузить расписание</span>
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

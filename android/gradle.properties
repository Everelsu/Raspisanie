org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
# Используем тот же JBR что и Flutter/Android Studio — иначе home_widget компилируется
# разными JDK, Kotlin-демон молча не создаёт class-файлы, и compile jar остаётся пустым.
org.gradle.java.home=C:\\Users\\egord\\AppData\\Local\\Programs\\Android Studio\\jbr
android.useAndroidX=true
android.enableJetifier=true
android.overridePathCheck=true
org.gradle.caching=true
org.gradle.parallel=true
# Избегаем ошибки R8 "SharedPreferencesPlugin is defined multiple times"
android.enableR8.fullMode=false

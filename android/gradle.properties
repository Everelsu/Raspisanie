org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
# org.gradle.java.home НЕ трогать здесь — это машинно-зависимый путь, в CI его
# нет и сборка падает с "Java home supplied is invalid". Если home_widget
# компилируется не тем JDK локально (Kotlin-демон молча не создаёт class-файлы),
# задайте org.gradle.java.home в СВОЁМ ~/.gradle/gradle.properties (не в репо).
android.useAndroidX=true
android.enableJetifier=true
android.overridePathCheck=true
org.gradle.caching=true
org.gradle.parallel=true
# Избегаем ошибки R8 "SharedPreferencesPlugin is defined multiple times"
android.enableR8.fullMode=false

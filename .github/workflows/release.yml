name: Release APK

# Релизный пайплайн по образцу Noctrinth:
#   1. Версия приложения живёт в pubspec.yaml (единственный источник истины —
#      имя тега лишь метка) и должна иметь запись в CHANGELOG.md.
#   2. Пуш тега v* собирает подписанный APK и публикует GitHub Release;
#      описание релиза берётся из записи CHANGELOG.md для этой версии.
#   3. Джоб finalize собирает манифест latest.json (версия, ссылка на APK,
#      sha256, размер, заметки) и коммитит его в отдельную ветку `updater`.
#      Приложение проверяет обновления по raw-ссылке на этот файл — без
#      GitHub API и его лимитов:
#        https://raw.githubusercontent.com/Everelsu/Raspisanie/updater/latest.json
#      Релиз публикуется сразу (не draft): манифест коммитится последним,
#      поэтому обновление становится видимым только когда APK уже доступен.
#
# Порядок релиза:
#   1. Поднять версию в pubspec.yaml (и build-номер после «+»).
#   2. Добавить запись в CHANGELOG.md для этой версии.
#   3. git tag v2.0.5 && git push origin v2.0.5
#
# Требуемые секреты репозитория (Settings → Secrets → Actions):
#   KEYSTORE_BASE64      — keystore в base64 (base64 -w 0 release.keystore)
#   KEY_STORE_PASSWORD   — пароль от keystore
#   KEY_PASSWORD         — пароль от ключа
#   KEY_ALIAS            — alias ключа
#
# Если секреты не заданы — APK подписывается debug-ключом (только для тестов).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например v2.0.5)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION, tag: $TAG"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::warning::Тег $TAG не совпадает с версией pubspec.yaml ($VERSION) — собирается версия из pubspec"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          if dart run tool/extract_changelog.dart "${{ steps.version.outputs.version }}" RELEASE_BODY.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::В CHANGELOG.md нет записи для ${{ steps.version.outputs.version }} — описание релиза будет сгенерировано автоматически"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Подготовка подписи. Все проверки — ДО сборки: если секрет забыт или
      # битый, узнаём об этом за секунды с понятной ошибкой, а не через
      # 7 минут на этапе packageRelease с криптическим KeytoolException.
      - name: Setup release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 not set — APK will use debug signing"
            exit 0
          fi

          # 1. Все четыре секрета обязательны разом.
          missing=""
          [ -z "$KEY_STORE_PASSWORD" ] && missing="$missing KEY_STORE_PASSWORD"
          [ -z "$KEY_PASSWORD" ] && missing="$missing KEY_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты:$missing. Нужны все 4: KEYSTORE_BASE64, KEY_STORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS (Settings → Secrets and variables → Actions)."
            exit 1
          fi

          # 2. Декодируем keystore.
          if ! echo "$KEYSTORE_BASE64" | base64 -d --ignore-garbage > android/app/release.keystore; then
            echo "::error::KEYSTORE_BASE64 не является валидным base64. Перегенерируйте: 'base64 -w 0 release.keystore' (Git Bash/WSL, НЕ certutil) и вставьте одной строкой без переносов."
            exit 1
          fi
          if [ ! -s android/app/release.keystore ]; then
            echo "::error::Раскодированный keystore пуст — секрет KEYSTORE_BASE64 повреждён."
            exit 1
          fi

          # 3. Проверяем пароль keystore и что alias существует.
          if ! keytool -list -keystore android/app/release.keystore \
              -storepass "$KEY_STORE_PASSWORD" > /tmp/keystore_list.txt 2>&1; then
            echo "::error::Не удалось открыть keystore — секрет KEY_STORE_PASSWORD неверен (или keystore битый). $(tail -1 /tmp/keystore_list.txt)"
            exit 1
          fi
          if ! keytool -list -keystore android/app/release.keystore \
              -storepass "$KEY_STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::В keystore нет ключа с alias '$KEY_ALIAS'. Доступные alias'ы:"
            grep -iE "alias|Запись" /tmp/keystore_list.txt || cat /tmp/keystore_list.txt
            exit 1
          fi
          echo "Keystore OK: alias '$KEY_ALIAS' найден, пароль верен."

          cat > android/key.properties << EOF
          storePassword=$KEY_STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.keystore
          EOF

      - name: Build release APK
        run: flutter build apk --release

      # Страховка от «зелёного релиза с debug-подписью»: если секреты заданы,
      # APK обязан быть подписан релизным ключом.
      - name: Verify APK signature
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          SIGNER=$("$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk | grep -m1 "certificate DN" || true)
          echo "$SIGNER"
          if echo "$SIGNER" | grep -qi "Android Debug"; then
            echo "::error::APK подписан debug-ключом, хотя keystore-секреты заданы — проверьте key.properties."
            exit 1
          fi

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/raspisanie-${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub Release (with changelog notes)
        if: steps.changelog.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Расписание v${{ steps.version.outputs.version }}"
          body_path: RELEASE_BODY.md
          files: build/app/outputs/flutter-apk/raspisanie-*.apk
          fail_on_unmatched_files: true

      - name: Create GitHub Release (auto notes fallback)
        if: steps.changelog.outputs.found != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Расписание v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/raspisanie-*.apk
          fail_on_unmatched_files: true

      - name: Upload release notes artifact
        if: steps.changelog.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_BODY.md

  # Публикация манифеста обновления: latest.json коммитится в отдельную
  # orphan-ветку `updater`, которую читает приложение. Выполняется после
  # публикации релиза, чтобы манифест никогда не указывал на недоступный APK.
  finalize:
    name: Publish updater manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Download release notes artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-notes

      - name: Build latest.json
        run: |
          set -euo pipefail
          APK_NAME="raspisanie-${VERSION}.apk"
          mkdir -p manifest
          gh release download "$TAG" --pattern "$APK_NAME" --dir manifest

          SHA256=$(sha256sum "manifest/$APK_NAME" | awk '{print $1}')
          SIZE=$(stat -c %s "manifest/$APK_NAME")
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}"
          [ -f RELEASE_BODY.md ] || touch RELEASE_BODY.md

          jq -n \
            --arg version "$VERSION" \
            --arg url "$URL" \
            --arg sha256 "$SHA256" \
            --argjson size "$SIZE" \
            --rawfile notes RELEASE_BODY.md \
            '{version: $version, date: (now | todate), apk: {url: $url, sha256: $sha256, size: $size}, notes: $notes}' \
            > manifest/latest.json
          cat manifest/latest.json

      - name: Commit manifest to updater branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin updater >/dev/null 2>&1; then
            git fetch origin updater
            git checkout updater
          else
            git checkout --orphan updater
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp manifest/latest.json latest.json
          git add latest.json
          git commit -m "updater: $TAG" || echo "Manifest unchanged"
          git push origin updater
